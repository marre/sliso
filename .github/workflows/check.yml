name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: python -m pip install 'shapely>=2,<3'
      - run: npm run test:python
      - run: npm run data:demo
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser integration tests
        run: CHROMIUM_PATH="$(find ~/.cache/ms-playwright -path '*/chrome-linux*/chrome' -type f | head -1)" npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 3

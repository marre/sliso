name: Prepare SL data (opt-in)
on:
  workflow_dispatch:
    inputs:
      prepare_walking:
        description: Rebuild conservative OSM walking distances and one-minute area contours (optional, slower)
        type: boolean
        default: false
      prepare_water:
        description: Build water-mask tiles from the same OSM extract (requires prepare_walking)
        type: boolean
        default: false
      publish_release:
        description: Publish compiled data to a GitHub Release and update the Cloudflare build pointer
        type: boolean
        default: false
      deploy:
        description: Publish this manual build (also requires SLISO_DEPLOY_ENABLED)
        type: boolean
        default: false
      export_source:
        description: Export the validated cached CC0 GTFS source for local processing (one-day retention)
        type: boolean
        default: false
      inventory_only:
        description: Inspect traffic data without walking graph or deployment
        type: boolean
        default: true
      initialize_quota_ledger:
        description: Initialize only after checking remaining Trafiklab quota
        type: boolean
        default: false
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
concurrency:
  group: sliso-daily-data
  cancel-in-progress: false
jobs:
  build:
    # Enabling this does NOT deploy or make the repository public.
    # A download ledger must be retained for monthly quota protection.
    if: github.event_name == 'workflow_dispatch' || vars.SLISO_DATA_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache quota ledger and once-daily source
        uses: actions/cache/restore@v4
        with:
          path: .data-build/
          key: sliso-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sliso-data-
      - name: Require versioned physical walking input
        if: github.event_name != 'workflow_dispatch' || !inputs.inventory_only
        run: test -f data/walking-index.json || test -f data/walking-graph.json
      - name: Initialize quota ledger explicitly
        if: github.event_name == 'workflow_dispatch' && inputs.initialize_quota_ledger
        env:
          TRAFIKLAB_GTFS_KEY: ${{ secrets.TRAFIKLAB_GTFS_KEY }}
        run: python scripts/fetch_gtfs.py --output .data-build/sl.zip --ledger .data-build/quota.json --init-ledger
      - name: Fetch at most once per day, enforce local monthly ceiling
        env:
          TRAFIKLAB_GTFS_KEY: ${{ secrets.TRAFIKLAB_GTFS_KEY }}
        run: python scripts/fetch_gtfs.py --output .data-build/sl.zip --ledger .data-build/quota.json
      - name: Export validated source for local data processing
        if: github.event_name == 'workflow_dispatch' && inputs.export_source
        uses: actions/upload-artifact@v4
        with:
          name: sliso-source-gtfs
          path: .data-build/sl.zip
          retention-days: 1
      - name: Inspect traffic feed without inventing walking data
        run: python scripts/inventory_gtfs.py --gtfs .data-build/sl.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sliso-gtfs-inventory
          path: .data-build/inventory/
          retention-days: 7
      - name: Require walking rebuild when water generation is requested
        if: github.event_name == 'workflow_dispatch' && inputs.prepare_water && (!inputs.prepare_walking || inputs.inventory_only)
        run: |
          echo '::error::prepare_water requires prepare_walking=true and inventory_only=false'
          exit 1
      - name: Install water extraction tools
        if: github.event_name == 'workflow_dispatch' && inputs.prepare_water
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool gdal-bin
      - name: Rebuild optional walking distances and network areas
        if: github.event_name == 'workflow_dispatch' && inputs.prepare_walking && !inputs.inventory_only
        run: |
          python -m venv /tmp/sliso-walking-venv
          /tmp/sliso-walking-venv/bin/pip install -r scripts/requirements-walking.txt
          walking_args=(--current-osm)
          if test "${{ inputs.prepare_water }}" = 'true'; then
            /tmp/sliso-walking-venv/bin/pip install 'shapely>=2,<3'
            walking_args=(--water-output .data-build/prepared-walking/water-tiles)
          fi
          /tmp/sliso-walking-venv/bin/python scripts/prepare_walking.py --gtfs .data-build/sl.zip --output .data-build/prepared-walking "${walking_args[@]}"
      - name: Save OSM source provenance
        if: github.event_name == 'workflow_dispatch' && inputs.prepare_walking && !inputs.inventory_only
        uses: actions/upload-artifact@v4
        with:
          name: sliso-walking-osm-source
          path: .data-build/prepared-walking/osm-source.json
          if-no-files-found: error
          retention-days: 30
      - name: Save generated water tiles for validation
        if: github.event_name == 'workflow_dispatch' && inputs.prepare_water
        uses: actions/upload-artifact@v4
        with:
          name: sliso-water-tiles
          path: .data-build/prepared-walking/water-tiles/
          if-no-files-found: error
          retention-days: 7
      - name: Save walking coverage and detour audit
        if: always() && (github.event_name != 'workflow_dispatch' || !inputs.inventory_only)
        uses: actions/upload-artifact@v4
        with:
          name: sliso-walking-audit
          path: .data-build/prepared-walking/walks.json.audit.json
          if-no-files-found: ignore
          retention-days: 7
      - if: github.event_name != 'workflow_dispatch' || !inputs.inventory_only
        run: |
          if test -f .data-build/prepared-walking/walks.json; then
            cp .data-build/prepared-walking/walks.json .data-build/walks.json
          elif python -c "import json,pathlib,sys; p=pathlib.Path('data/release.json'); sys.exit(0 if p.exists() and json.loads(p.read_text()).get('features',{}).get('walkingAreas') else 1)"; then
            echo '::error::Prepared walking cache missing. Run with prepare_walking=true to rebuild; refusing to silently drop walking areas.'
            exit 1
          elif test -f data/walking-index.json; then
            cp data/walking-index.json .data-build/walks.json
          else
            python scripts/build_walks.py --graph data/walking-graph.json --output .data-build/walks.json
          fi
      - if: github.event_name != 'workflow_dispatch' || !inputs.inventory_only
        run: |
          area_args=()
          if test -f .data-build/prepared-walking/areas/index.json; then
            area_args=(--walking-areas .data-build/prepared-walking/areas)
          fi
          if test -f .data-build/prepared-walking/footpaths/index.json; then
            area_args+=(--footpaths .data-build/prepared-walking/footpaths)
          elif python -c "import json,sys; sys.exit(0 if json.load(open('data/release.json')).get('features',{}).get('footpaths') else 1)"; then
            echo '::error::Footpath cache missing. Rebuild with prepare_walking=true; refusing to drop map origins.'
            exit 1
          fi
          if test -f .data-build/prepared-walking/water-bitmap/index.json; then
            area_args+=(--water-mask .data-build/prepared-walking/water-bitmap)
          fi
          python scripts/build_data.py --gtfs .data-build/sl.zip --walks .data-build/walks.json --scope data/feed-scope.json --output .data-build/published "${area_args[@]}"
      - name: Audit precomputed walking profiles and outward station access
        if: github.event_name != 'workflow_dispatch' || !inputs.inventory_only
        run: python scripts/walking_coverage.py --manifest .data-build/published/manifest.json --output .data-build/walking-coverage.json --csv .data-build/walking-coverage-gaps.csv
      - name: Save walking profile coverage and unresolved exits
        if: always() && (github.event_name != 'workflow_dispatch' || !inputs.inventory_only)
        uses: actions/upload-artifact@v4
        with:
          name: sliso-walking-coverage
          path: |
            .data-build/walking-coverage.json
            .data-build/walking-coverage-gaps.csv
          if-no-files-found: ignore
          retention-days: 7
      - if: github.event_name != 'workflow_dispatch' || !inputs.inventory_only
        run: python scripts/prune_data.py --root .data-build/published --keep 2
      - if: github.event_name != 'workflow_dispatch' || !inputs.inventory_only
        run: mkdir -p public/data && cp -R .data-build/published/. public/data/
      - if: github.event_name != 'workflow_dispatch' || !inputs.inventory_only
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - if: github.event_name != 'workflow_dispatch' || !inputs.inventory_only
        run: npm ci
      - if: github.event_name != 'workflow_dispatch' || !inputs.inventory_only
        run: npm test && npm run test:python && npm run build
      - if: github.event_name != 'workflow_dispatch' || !inputs.inventory_only
        uses: actions/upload-artifact@v4
        with:
          name: sliso-validated-data
          path: dist/
          retention-days: 3
      - name: Publish on Cloudflare Pages only after explicit opt-in
        if: vars.SLISO_DEPLOY_ENABLED == 'true' && (github.event_name != 'workflow_dispatch' || inputs.deploy) && (github.event_name != 'workflow_dispatch' || !inputs.inventory_only)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=sliso
      - name: Persist quota even after a failed download or validation
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .data-build/
          key: sliso-data-${{ github.run_id }}-${{ github.run_attempt }}

  publish-release:
    if: (github.event_name == 'workflow_dispatch' && inputs.publish_release && !inputs.inventory_only) || (github.event_name == 'schedule' && vars.SLISO_RELEASE_ENABLED == 'true')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: sliso-validated-data
          path: .release-build
      - name: Package validated traffic and walking data outside Git
        run: python scripts/release_data.py pack --root .release-build/data --output .data-build/sliso-data.zip --descriptor .data-build/release.json --repository "$GITHUB_REPOSITORY"
      - name: Publish an immutable data release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          data_version=$(python -c "import json; print(json.load(open('.data-build/release.json'))['version'])")
          gh release create "data-$data_version" .data-build/sliso-data.zip --target "$GITHUB_SHA" --latest=false --title "sliso data $data_version" --notes 'Compiled GTFS and partial OSM walking data. CC0 / ODbL; provenance and limitations in data/README.md. Download integrity is pinned in data/release.json.'
      - name: Update the small data pointer for Cloudflare Git integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          cp .data-build/release.json data/release.json
          git add data/release.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update pinned real-data release for Cloudflare'
            git push origin HEAD:main
          fi
